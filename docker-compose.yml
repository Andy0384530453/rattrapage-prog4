# Postgres local pour le développement (voir run-local.sh).
# Le schéma est créé par Flyway au démarrage de l'app, exactement comme sur Neon.
services:
  postgres:
    image: postgres:13.9
    container_name: rattrapage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rattrapage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rattrapage"]
      interval: 5s
      timeout: 5s
      retries: 10
